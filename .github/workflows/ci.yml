name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  flutter:
    name: Flutter format, analyze, test, and Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test patrol_test test_driver

      - name: Analyze Flutter sources
        run: flutter analyze --fatal-infos

      - name: Run Flutter unit and widget tests
        run: flutter test test

      - name: Build development Web app
        run: >-
          flutter build web --no-wasm-dry-run
          -t lib/main_development.dart

  functions:
    name: Functions lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci

      - name: Lint Functions
        run: npm run lint

      - name: Test Functions
        run: npm test

      - name: Audit Functions production dependencies
        run: npm audit --omit=dev --audit-level=high
