flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app-icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FEFDFB"
  adaptive_icon_foreground: assets/app-icon.png
  web:
    generate: true
    image_path: assets/app-icon.png
    background_color: "#FEFDFB"
    theme_color: "#15579A"
  windows:
    generate: true
    image_path: assets/app-icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/app-icon.png
