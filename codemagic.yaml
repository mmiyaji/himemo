workflows:
  cloudkit-schema-export:
    name: CloudKit Schema Export
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      xcode: latest
      groups:
        - cloudkit
      vars:
        CLOUDKIT_CONTAINER_ID: iCloud.org.ruhenheim.himemo
    scripts:
      - name: Validate checked CloudKit schema manifest
        script: |
          set -euo pipefail
          python3 tools/cloudkit/check_expected_schema.py
      - name: Export CloudKit development and production schemas
        script: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "APPLE_TEAM_ID is required."
            exit 1
          fi
          if [ -z "${CLOUDKIT_MANAGEMENT_TOKEN:-}" ]; then
            echo "CLOUDKIT_MANAGEMENT_TOKEN is required."
            exit 1
          fi
          mkdir -p build/cloudkit
          xcrun cktool export-schema \
            --team-id "$APPLE_TEAM_ID" \
            --container-id "$CLOUDKIT_CONTAINER_ID" \
            --environment development \
            --output-file build/cloudkit/development-schema.ckdb
          xcrun cktool export-schema \
            --team-id "$APPLE_TEAM_ID" \
            --container-id "$CLOUDKIT_CONTAINER_ID" \
            --environment production \
            --output-file build/cloudkit/production-schema.ckdb
          python3 tools/cloudkit/check_expected_schema.py \
            build/cloudkit/development-schema.ckdb \
            build/cloudkit/production-schema.ckdb
          ls -lh build/cloudkit
    artifacts:
      - build/cloudkit/*.ckdb

  ios-testflight-production:
    name: iOS TestFlight (Production)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic HiMemo
    environment:
      flutter: 3.41.6
      node: "20"
      xcode: latest
      cocoapods: default
      groups:
        - google_drive_oauth
      vars:
        BUNDLE_ID: org.ruhenheim.himemo
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      ios_signing:
        certificates:
          - HiMemo Apple Distribution
        provisioning_profiles:
          - HiMemo App Store Profile
          - HiMemo Widget App Store Profile
          - HiMemo Share Extension App Store Profile
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
        - ~/.cocoapods/repos
    scripts:
      - name: Show toolchain versions
        script: |
          flutter --version
          xcodebuild -version
          pod --version
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Run mandatory release validation
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed \
            lib test integration_test patrol_test test_driver
          flutter analyze --fatal-infos
          flutter test test
          flutter build web --no-wasm-dry-run -t lib/main_development.dart
          npm --prefix functions ci
          npm --prefix functions run lint
          npm --prefix functions test
          npm --prefix functions audit --omit=dev --audit-level=high
      - name: Install CocoaPods dependencies
        script: |
          find ios -name "Podfile" -execdir pod install \;
      - name: Configure iOS code signing
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/ios/Runner.xcodeproj" \
            --verbose \
            --custom-export-options='{"method":"app-store"}'
      - name: Configure Google Sign-In
        script: |
          PLIST="$CM_BUILD_DIR/ios/Runner/Info.plist"
          if [ -n "${HIMEMO_GOOGLE_SIGN_IN_CLIENT_ID:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :GIDClientID ${HIMEMO_GOOGLE_SIGN_IN_CLIENT_ID}" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :GIDClientID string ${HIMEMO_GOOGLE_SIGN_IN_CLIENT_ID}" "$PLIST"
          fi
          if [ -n "${HIMEMO_GOOGLE_REVERSED_CLIENT_ID:-}" ]; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:1:CFBundleTypeRole Editor" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleTypeRole string Editor" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:1:CFBundleURLName google-sign-in" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLName string google-sign-in" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:1:CFBundleURLSchemes:0 ${HIMEMO_GOOGLE_REVERSED_CLIENT_ID}" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string ${HIMEMO_GOOGLE_REVERSED_CLIENT_ID}" "$PLIST"
          fi
      - name: Build production IPA
        script: |
          flutter build ipa --release \
            -t lib/main_production.dart \
            --dart-define=HIMEMO_GOOGLE_SIGN_IN_CLIENT_ID="${HIMEMO_GOOGLE_SIGN_IN_CLIENT_ID:-}" \
            --dart-define=HIMEMO_GOOGLE_SIGN_IN_SERVER_CLIENT_ID="${HIMEMO_GOOGLE_SIGN_IN_SERVER_CLIENT_ID:-}" \
            --dart-define=HIMEMO_APP_STORE_ID="${HIMEMO_APP_STORE_ID:-}" \
            --dart-define=HIMEMO_BUILD_DATE="$(date -u +%Y-%m-%d)" \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Verify production IPA entitlements
        script: |
          set -euo pipefail
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was produced."
            exit 1
          fi
          VERIFY_DIR="$(mktemp -d)"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          codesign -d --entitlements :- "$VERIFY_DIR/Payload/Runner.app" > "$VERIFY_DIR/entitlements.plist"
          cat "$VERIFY_DIR/entitlements.plist"
          if ! /usr/libexec/PlistBuddy -c "Print :com.apple.developer.icloud-services" "$VERIFY_DIR/entitlements.plist" | grep -q CloudKit; then
            echo "Missing CloudKit service entitlement."
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :com.apple.developer.icloud-container-identifiers" "$VERIFY_DIR/entitlements.plist" | grep -q iCloud.org.ruhenheim.himemo; then
            echo "Missing HiMemo iCloud container entitlement."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.icloud-container-environment" "$VERIFY_DIR/entitlements.plist" || true
          rm -rf "$VERIFY_DIR"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
      - test-results/**/*.xml
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal

